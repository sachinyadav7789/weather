<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard · Async & REST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #e0f2fe 0%, #bae6fd 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
      color: #0c4a6e;
    }

    .dashboard {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 36px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0c4a6e;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subhead {
      color: #475569;
      font-size: 0.9rem;
      margin-bottom: 28px;
      border-left: 4px solid #0ea5e9;
      padding-left: 14px;
      background: rgba(14, 165, 233, 0.06);
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
    }

    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .search-row input {
      flex: 1 1 200px;
      padding: 16px 20px;
      border: 2px solid transparent;
      border-radius: 24px;
      background: white;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
      color: #0c4a6e;
    }

    .search-row input:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }

    .search-row button {
      padding: 0 32px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 24px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 18px -8px #0ea5e9;
      min-width: 120px;
    }

    .search-row button:hover {
      background: #0284c7;
      transform: translateY(-1px);
    }

    .search-row button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #475569;
      font-size: 1rem;
      display: none;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      background: #fee2e2;
      border-left: 4px solid #dc2626;
      color: #991b1b;
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .error-box.active {
      display: block;
    }

    .weather-result {
      display: none;
    }

    .weather-result.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
    }

    .location-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0c4a6e;
    }

    .location-meta {
      font-size: 0.85rem;
      color: #64748b;
    }

    .main-metric {
      display: flex;
      align-items: center;
      gap: 20px;
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
      border-radius: 24px;
      padding: 24px 28px;
      margin-bottom: 20px;
      border: 1px solid rgba(14, 165, 233, 0.15);
    }

    .temp-big {
      font-size: 3.5rem;
      font-weight: 700;
      color: #0c4a6e;
      line-height: 1;
    }

    .temp-unit {
      font-size: 1.5rem;
      font-weight: 400;
      color: #64748b;
    }

    .condition {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .condition-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0c4a6e;
    }

    .condition-desc {
      font-size: 0.85rem;
      color: #64748b;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: white;
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .metric-label {
      font-size: 0.78rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0c4a6e;
    }

    .metric-sub {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .hourly-preview {
      background: white;
      border-radius: 20px;
      padding: 18px 20px;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .hourly-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #0c4a6e;
      margin-bottom: 12px;
    }

    .hourly-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .hourly-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .hourly-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .hour-item {
      flex: 0 0 auto;
      text-align: center;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 14px;
      min-width: 70px;
    }

    .hour-time {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .hour-temp {
      font-size: 1rem;
      font-weight: 600;
      color: #0c4a6e;
    }

    .hour-icon {
      font-size: 1.2rem;
      margin: 2px 0;
    }

    @media (max-width: 480px) {
      .dashboard { padding: 24px 18px; }
      h1 { font-size: 1.6rem; }
      .temp-big { font-size: 2.8rem; }
      .main-metric { flex-direction: column; align-items: flex-start; gap: 12px; }
      .search-row button { width: 100%; padding: 14px; }
    }
  </style>
</head>
<body>

<div class="dashboard">
  <h1>🌤️ Weather Dashboard</h1>
  <p class="subhead">Async/Await · Fetch API · Real-time JSON · Open-Meteo (no API key)</p>

  <!-- Search -->
  <div class="search-row">
    <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, Tokyo, Mumbai)…" autocomplete="off" />
    <button id="searchBtn">🔍 Search</button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Fetching weather data…</p>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Result -->
  <div class="weather-result" id="weatherResult">
    <div class="location-header">
      <div class="location-name" id="locName">—</div>
      <div class="location-meta" id="locMeta">—</div>
    </div>

    <div class="main-metric">
      <div>
        <span class="temp-big" id="tempMain">—</span>
        <span class="temp-unit">°C</span>
      </div>
      <div class="condition">
        <span class="condition-text" id="conditionText">—</span>
        <span class="condition-desc" id="conditionDesc">—</span>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">💧 Humidity</div>
        <div class="metric-value" id="humidity">—</div>
        <div class="metric-sub">Relative humidity</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💨 Wind Speed</div>
        <div class="metric-value" id="windSpeed">—</div>
        <div class="metric-sub" id="windDir">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">🌡️ Feels Like</div>
        <div class="metric-value" id="feelsLike">—</div>
        <div class="metric-sub">Apparent temperature</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">☀️ UV Index</div>
        <div class="metric-value" id="uvIndex">—</div>
        <div class="metric-sub" id="uvLabel">—</div>
      </div>
    </div>

    <div class="hourly-preview">
      <div class="hourly-title">🕐 Next few hours</div>
      <div class="hourly-scroll" id="hourlyScroll">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ---------- DOM ----------
    const cityInput   = document.getElementById('cityInput');
    const searchBtn   = document.getElementById('searchBtn');
    const loadingEl   = document.getElementById('loading');
    const errorBox    = document.getElementById('errorBox');
    const weatherResult = document.getElementById('weatherResult');

    const locName     = document.getElementById('locName');
    const locMeta     = document.getElementById('locMeta');
    const tempMain    = document.getElementById('tempMain');
    const conditionText = document.getElementById('conditionText');
    const conditionDesc = document.getElementById('conditionDesc');
    const humidity    = document.getElementById('humidity');
    const windSpeed   = document.getElementById('windSpeed');
    const windDir     = document.getElementById('windDir');
    const feelsLike   = document.getElementById('feelsLike');
    const uvIndex     = document.getElementById('uvIndex');
    const uvLabel     = document.getElementById('uvLabel');
    const hourlyScroll = document.getElementById('hourlyScroll');

    // ---------- HELPERS ----------
    // WMO Weather interpretation codes (simplified)
    // Reference: https://open-meteo.com/en/docs
    const weatherCodeMap = {
      0:  { text: 'Clear sky', icon: '☀️' },
      1:  { text: 'Mainly clear', icon: '🌤️' },
      2:  { text: 'Partly cloudy', icon: '⛅' },
      3:  { text: 'Overcast', icon: '☁️' },
      45: { text: 'Fog', icon: '🌫️' },
      48: { text: 'Depositing rime fog', icon: '🌫️' },
      51: { text: 'Light drizzle', icon: '🌦️' },
      53: { text: 'Moderate drizzle', icon: '🌦️' },
      55: { text: 'Dense drizzle', icon: '🌧️' },
      56: { text: 'Light freezing drizzle', icon: '🌧️' },
      57: { text: 'Dense freezing drizzle', icon: '🌧️' },
      61: { text: 'Slight rain', icon: '🌦️' },
      63: { text: 'Moderate rain', icon: '🌧️' },
      65: { text: 'Heavy rain', icon: '🌧️' },
      66: { text: 'Light freezing rain', icon: '🌧️' },
      67: { text: 'Heavy freezing rain', icon: '🌧️' },
      71: { text: 'Slight snow', icon: '🌨️' },
      73: { text: 'Moderate snow', icon: '🌨️' },
      75: { text: 'Heavy snow', icon: '❄️' },
      77: { text: 'Snow grains', icon: '❄️' },
      80: { text: 'Slight rain showers', icon: '🌦️' },
      81: { text: 'Moderate rain showers', icon: '🌧️' },
      82: { text: 'Violent rain showers', icon: '⛈️' },
      85: { text: 'Slight snow showers', icon: '🌨️' },
      86: { text: 'Heavy snow showers', icon: '❄️' },
      95: { text: 'Thunderstorm', icon: '⛈️' },
      96: { text: 'Thunderstorm with slight hail', icon: '⛈️' },
      99: { text: 'Thunderstorm with heavy hail', icon: '⛈️' },
    };

    function getWeatherInfo(code) {
      return weatherCodeMap[code] || { text: 'Unknown', icon: '❓' };
    }

    function uvLabelText(uv) {
      if (uv == null) return '—';
      if (uv < 3) return 'Low';
      if (uv < 6) return 'Moderate';
      if (uv < 8) return 'High';
      if (uv < 11) return 'Very High';
      return 'Extreme';
    }

    function degToCompass(deg) {
      if (deg == null) return '—';
      const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const idx = Math.round(deg / 22.5) % 16;
      return dirs[idx];
    }

    function showLoading(show) {
      loadingEl.classList.toggle('active', show);
      if (show) {
        weatherResult.classList.remove('active');
        errorBox.classList.remove('active');
      }
      searchBtn.disabled = show;
    }

    function showError(msg) {
      errorBox.textContent = '⚠️ ' + msg;
      errorBox.classList.add('active');
      weatherResult.classList.remove('active');
    }

    function clearError() {
      errorBox.classList.remove('active');
      errorBox.textContent = '';
    }

    // ---------- MAIN FETCH LOGIC ----------
    async function fetchWeather(city) {
      if (!city || !city.trim()) {
        showError('Please enter a city name.');
        return;
      }

      clearError();
      showLoading(true);

      try {
        // STEP 1: Geocoding — city name to coordinates
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city.trim())}&count=1&language=en&format=json`;
        const geoRes = await fetch(geoUrl);

        if (!geoRes.ok) {
          throw new Error(`Geocoding request failed (HTTP ${geoRes.status})`);
        }

        const geoData = await geoRes.json();

        // Check for JSON-level error
        if (geoData.error) {
          throw new Error(geoData.reason || 'Geocoding failed');
        }

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error(`City "${city}" not found. Try a different name.`);
        }

        const location = geoData.results[0];
        const { latitude, longitude, name, country, admin1, timezone } = location;

        // STEP 2: Weather — fetch current + hourly
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +
          `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,uv_index` +
          `&hourly=temperature_2m,weather_code` +
          `&timezone=auto&forecast_days=1`;

        const weatherRes = await fetch(weatherUrl);

        if (!weatherRes.ok) {
          throw new Error(`Weather request failed (HTTP ${weatherRes.status})`);
        }

        const weatherData = await weatherRes.json();

        if (weatherData.error) {
          throw new Error(weatherData.reason || 'Weather data unavailable');
        }

        if (!weatherData.current) {
          throw new Error('Invalid weather response format');
        }

        // STEP 3: Render
        renderWeather(location, weatherData);

      } catch (err) {
        console.error('Weather fetch error:', err);
        showError(err.message || 'Something went wrong. Please check your connection and try again.');
      } finally {
        showLoading(false);
      }
    }

    // ---------- RENDER ----------
    function renderWeather(location, data) {
      const current = data.current;
      const hourly = data.hourly;

      // Location
      const locParts = [location.name];
      if (location.admin1) locParts.push(location.admin1);
      if (location.country) locParts.push(location.country);
      locName.textContent = locParts.join(', ');
      locMeta.textContent = `📍 ${location.latitude.toFixed(2)}°, ${location.longitude.toFixed(2)}° · ${location.timezone || 'local'}`;

      // Temperature
      tempMain.textContent = Math.round(current.temperature_2m);

      // Condition
      const weatherInfo = getWeatherInfo(current.weather_code);
      conditionText.textContent = weatherInfo.text;
      conditionDesc.textContent = `${weatherInfo.icon} WMO code: ${current.weather_code}`;

      // Metrics
      humidity.textContent = current.relative_humidity_2m + '%';
      windSpeed.textContent = current.wind_speed_10m + ' km/h';
      windDir.textContent = degToCompass(current.wind_direction_10m) + ' (' + current.wind_direction_10m + '°)';
      feelsLike.textContent = Math.round(current.apparent_temperature) + '°C';
      uvIndex.textContent = current.uv_index != null ? current.uv_index.toFixed(1) : '—';
      uvLabel.textContent = uvLabelText(current.uv_index);

      // Hourly preview (next 6 hours from now)
      hourlyScroll.innerHTML = '';
      if (hourly && hourly.time && hourly.temperature_2m) {
        // Find current hour index
        const now = new Date();
        const currentHourISO = now.toISOString().slice(0, 13) + ':00';
        let startIdx = hourly.time.findIndex(t => t >= currentHourISO);
        if (startIdx === -1) startIdx = 0;

        const count = Math.min(8, hourly.time.length - startIdx);
        for (let i = 0; i < count; i++) {
          const idx = startIdx + i;
          const timeStr = hourly.time[idx];
          const temp = hourly.temperature_2m[idx];
          const code = hourly.weather_code ? hourly.weather_code[idx] : 0;
          const info = getWeatherInfo(code);

          const hourDiv = document.createElement('div');
          hourDiv.className = 'hour-item';

          const d = new Date(timeStr);
          const hourLabel = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

          hourDiv.innerHTML = `
            <div class="hour-time">${hourLabel}</div>
            <div class="hour-icon">${info.icon}</div>
            <div class="hour-temp">${Math.round(temp)}°</div>
          `;
          hourlyScroll.appendChild(hourDiv);
        }
      }

      weatherResult.classList.add('active');
    }

    // ---------- EVENT LISTENERS ----------
    searchBtn.addEventListener('click', () => {
      fetchWeather(cityInput.value);
    });

    cityInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        fetchWeather(cityInput.value);
      }
    });

    // ---------- INIT: Load a default city to demonstrate ----------
    // Berlin is a known working example per Open-Meteo docs [citation:2][citation:12]
    window.addEventListener('DOMContentLoaded', () => {
      cityInput.value = 'Berlin';
      // Small delay to ensure DOM is fully ready
      setTimeout(() => fetchWeather('Berlin'), 100);
    });

  })();
</script>

</body>
</html>
